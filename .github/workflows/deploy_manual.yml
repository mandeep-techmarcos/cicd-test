name: ManiBall Deployment CI/CD Pipeline

on:
  push:
    branches:
      - prod
      - dev
      - qa

  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch name to rollback from (dev, qa, prod, feature/*, hotfix/*)'
        required: true
        default: dev
        type: string

      rollback_env:
        description: "Rollback environment"
        required: true
        type: choice
        options:
          - prod
          - dev
          - qa

      rollback_commit:
        description: "Git commit SHA to rollback"
        required: true

env:
  TARGET_THEME_DIR: 'public/wp-content/themes/maniball'

# =====================================================
# PRODUCTION DEPLOY (UNCHANGED)
# =====================================================
jobs:
  prod-deploy:
    if: github.ref == 'refs/heads/prod'
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install & Build
        run: |
          cd ${{ env.TARGET_THEME_DIR }}
          composer install --ignore-platform-reqs --no-plugins
          npm install
          npm run build

      - name: Deploy PROD
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY_PROD }}
          REMOTE_HOST: ${{ vars.HOST_PROD }}
          REMOTE_USER: ${{ vars.USERNAME_PROD }}
          TARGET: ${{ vars.TARGET_DIR_PROD }}
          ARGS: >-
            -rlgoDzvc
            --exclude='.git'
            --exclude='.htaccess'
            --exclude='wp-config.php'
            --exclude='wp-content/uploads'
            --exclude='wp-content/cache'
            --exclude='wp-content/themes/maniball/.env'
            --del
          SCRIPT_BEFORE: |
            cd ${{ vars.TARGET_DIR_PROD }}/public
            cp .htaccess ~/.htaccess_backup || true
          SCRIPT_AFTER: |
            cd ${{ vars.TARGET_DIR_PROD }}/public
            aws s3 sync . ${{ vars.AWS_S3_BUCKET_PROD }}
            cp ~/.htaccess_backup .htaccess || true

# =====================================================
# DEV DEPLOY (UNCHANGED)
# =====================================================
  dev-deploy:
    if: github.ref == 'refs/heads/dev'
    name: Deploy to Dev
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }
      - uses: actions/setup-node@v3
        with: { node-version: '22' }

      - name: Install & Build
        run: |
          cd ${{ env.TARGET_THEME_DIR }}
          composer install --ignore-platform-reqs --no-plugins
          npm install
          npm run build

      - name: Deploy DEV
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY_DEVQA }}
          REMOTE_HOST: ${{ vars.HOST_DEV }}
          REMOTE_USER: ${{ vars.USERNAME_DEV }}
          TARGET: ${{ vars.TARGET_DIR_DEV }}
          ARGS: >-
            -rlgoDzvc
            --exclude='.git'
            --exclude='.htaccess'
            --exclude='wp-config.php'
            --exclude='wp-content/uploads'
            --exclude='wp-content/cache'
            --exclude='wp-content/themes/maniball/.env'
            --del
          SCRIPT_BEFORE: |
            cd ${{ vars.TARGET_DIR_DEV }}/public
            cp .htaccess ~/.htaccess_backup || true
          SCRIPT_AFTER: |
            cd ${{ vars.TARGET_DIR_DEV }}/public
            aws s3 sync . ${{ vars.AWS_S3_BUCKET_DEV }}
            cp ~/.htaccess_backup .htaccess || true

# =====================================================
# QA DEPLOY (UNCHANGED)
# =====================================================
  qa-deploy:
    if: github.ref == 'refs/heads/qa'
    name: Deploy to QA
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }
      - uses: actions/setup-node@v3
        with: { node-version: '22' }

      - name: Install & Build
        run: |
          cd ${{ env.TARGET_THEME_DIR }}
          composer install --ignore-platform-reqs --no-plugins
          npm install
          npm run build

      - name: Deploy QA
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY_DEVQA }}
          REMOTE_HOST: ${{ vars.HOST_QA }}
          REMOTE_USER: ${{ vars.USERNAME_QA }}
          TARGET: ${{ vars.TARGET_DIR_QA }}
          ARGS: >-
            -rlgoDzvc
            --exclude='.git'
            --exclude='.htaccess'
            --exclude='wp-config.php'
            --exclude='wp-content/uploads'
            --exclude='wp-content/cache'
            --exclude='wp-content/themes/maniball/.env'
            --del
          SCRIPT_BEFORE: |
            cd ${{ vars.TARGET_DIR_QA }}/public
            cp .htaccess ~/.htaccess_backup || true
          SCRIPT_AFTER: |
            cd ${{ vars.TARGET_DIR_QA }}/public
            aws s3 sync . ${{ vars.AWS_S3_BUCKET_QA }}
            cp ~/.htaccess_backup .htaccess || true

# =====================================================
# MANUAL ROLLBACK (ANY BRANCH – MINIMAL CHANGE)
# =====================================================
  rollback:
    if: github.event_name == 'workflow_dispatch'
    name: Manual Rollback
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Fetch target branch
        run: |
          git fetch origin ${{ github.event.inputs.target_branch }}

      - name: Checkout rollback commit
        run: |
          git checkout ${{ github.event.inputs.rollback_commit }}

      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }

      - uses: actions/setup-node@v3
        with: { node-version: '22' }

      - name: Build rollback version
        run: |
          cd ${{ env.TARGET_THEME_DIR }}
          composer install --ignore-platform-reqs --no-plugins
          npm install
          npm run build

      - name: Deploy rollback
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ github.event.inputs.rollback_env == 'prod' && secrets.SSH_KEY_PROD || secrets.SSH_KEY_DEVQA }}
          REMOTE_HOST: ${{ github.event.inputs.rollback_env == 'prod' && vars.HOST_PROD || github.event.inputs.rollback_env == 'dev' && vars.HOST_DEV || vars.HOST_QA }}
          REMOTE_USER: ${{ github.event.inputs.rollback_env == 'prod' && vars.USERNAME_PROD || github.event.inputs.rollback_env == 'dev' && vars.USERNAME_DEV || vars.USERNAME_QA }}
          TARGET: ${{ github.event.inputs.rollback_env == 'prod' && vars.TARGET_DIR_PROD || github.event.inputs.rollback_env == 'dev' && vars.TARGET_DIR_DEV || vars.TARGET_DIR_QA }}
          ARGS: >-
            -rlgoDzvc
            --exclude='.git'
            --exclude='.htaccess'
            --exclude='wp-config.php'
            --exclude='wp-content/uploads'
            --exclude='wp-content/cache'
            --exclude='wp-content/themes/maniball/.env'
            --del
